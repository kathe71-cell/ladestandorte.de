name: Automated BNetzA City Data Sync

on:
  schedule:
    # Monthly at 03:00 on the 1st day of each month
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bnetza-data:
    name: Check & Update BNetzA Data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run BNetzA update pipeline
        run: npm run data:bnetza:update

      - name: Run test suite & build verification
        run: |
          npm test
          npm run build

      - name: Generate PR summary & metadata
        id: summary
        run: node scripts/generate-pr-summary.mjs

      - name: Create Pull Request if changes detected
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'data: BNetzA Monatsupdate ${{ steps.summary.outputs.snapshot_date }}'
          title: 'data: BNetzA Monatsupdate ${{ steps.summary.outputs.snapshot_date }}'
          body-path: reports/data/bnetza-pr-summary.md
          branch: data/bnetza-monthly-update
          delete-branch: true
          reviewers: kathe71-cell
          labels: |
            data-update
            bnetza
            automated-pr
            needs-review

      - name: Log PR notification status
        if: steps.cpr.outputs.pull-request-number
        run: |
          echo "========================================================"
          echo "🚀 Pull Request #${{ steps.cpr.outputs.pull-request-number }} created/updated:"
          echo "   URL: ${{ steps.cpr.outputs.pull-request-url }}"
          echo "   Reviewer assigned: kathe71-cell"
          echo "   Notification triggered via GitHub Notifications."
          echo "   Manual review and merge required before production."
          echo "========================================================"
