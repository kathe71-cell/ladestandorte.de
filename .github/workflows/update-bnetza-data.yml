name: Automated BNetzA City Data Sync

on:
  schedule:
    # Monthly at 03:00 on the 1st day of each month
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bnetza-data:
    name: Check & Update BNetzA Data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run BNetzA update pipeline
        run: npm run data:bnetza:update

      - name: Run test suite & build verification
        run: |
          npm test
          npm run build

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'data(cities): automated monthly BNetzA & Destatis data update'
          title: 'Automated Monthly BNetzA City Data Update'
          body: |
            ## Automated BNetzA City Data Sync
            
            This pull request was automatically generated by the monthly BNetzA data sync pipeline.
            
            - Generated dataset: `src/data/generated/cities.generated.json`
            - Difference report: check `reports/data/cities/`
            - Integrity checks: `npm run data:bnetza:check` passed
            - All test suites passed
          branch: data/bnetza-monthly-update
          delete-branch: true
