name: CI / Pull Request Verification & Data Integrity Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Integrity & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Mandatory Data Integrity Gate
        run: npm run gate:check

      - name: Run Full Regression Test Suite
        run: npm test

      - name: Verify Production SSR Build
        run: npm run build:ci
